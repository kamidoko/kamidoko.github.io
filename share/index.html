<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>紙どこに招待されました</title>
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: #FBF6E8;
    color: #4A3A2C;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    box-sizing: border-box;
  }
  .card {
    background: #FFFDF8;
    border-radius: 24px;
    padding: 28px 24px 22px;
    width: 100%;
    max-width: 480px;
    box-sizing: border-box;
    box-shadow: 0 4px 24px rgba(74, 58, 44, 0.08);
    text-align: center;
  }
  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 24px;
  }
  .applogo {
    /* AppLogo.png は 478×185 (≒ 2.58:1)。height 基準で見やすいサイズに固定。 */
    height: 56px;
    width: auto;
    display: block;
  }
  /* fallback セクション内のアプリアイコン (App Store バッジの上に小さく置く) */
  .install-icon {
    width: 56px;
    height: 56px;
    border-radius: 13px;  /* iOS squircle 近似 (76→17 と同比) */
    box-shadow: 0 2px 8px rgba(74, 58, 44, 0.15);
    display: block;
    margin: 0 auto 14px;
  }
  h1 {
    font-size: 21px;
    margin: 0 0 8px;
    font-weight: 700;
    line-height: 1.5;
  }
  .map-name {
    color: #F0592B;
    word-break: break-word;
  }
  .sub {
    color: #9B8E7D;
    font-size: 14px;
    margin: 0 0 26px;
  }
  .btn {
    display: inline-block;
    background: #F0592B;
    color: #FFFFFF;
    padding: 14px 36px;
    border-radius: 16px;
    font-size: 17px;
    font-weight: 700;
    text-decoration: none;
    min-width: 200px;
    box-sizing: border-box;
  }
  .btn:active { opacity: 0.85; }
  .spinner {
    color: #9B8E7D;
    font-size: 13px;
    margin: 18px 0 0;
  }
  .fallback {
    margin-top: 26px;
    padding-top: 22px;
    border-top: 1px solid #EFE7DA;
  }
  .fallback p {
    color: #6B5B49;
    font-size: 13px;
    line-height: 1.6;
    margin: 0 0 14px;
  }
  .appstore-badge {
    display: inline-block;
    /* Apple ガイドライン: バッジ高さ 40px 推奨 (本サイトでは画面に合わせ 48px) */
    height: 48px;
    width: auto;
  }
  .error {
    color: #C44; font-size: 14px; margin: 12px 0 0;
  }
  .footer {
    margin-top: 22px;
    padding-top: 16px;
    border-top: 1px solid #EFE7DA;
    font-size: 11px;
    line-height: 1.8;
    color: #9B8E7D;
  }
  .footer a {
    color: #9B8E7D;
    text-decoration: none;
  }
  .footer a:hover { color: #F0592B; }
  .footer .sep {
    margin: 0 6px;
    color: #D8CFC0;
  }
  .footer .mail {
    display: block;
    margin-top: 6px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <img class="applogo" src="applogo.png" alt="紙マップでどこ？" height="56">
    </div>
    <h1 id="title">招待を読み込んでいます…</h1>
    <p class="sub" id="sub">少しお待ちください</p>
    <a id="open" class="btn" style="display:none">アプリで開きます</a>
    <p class="spinner" id="spinner" style="display:none">アプリを開いています…</p>
    <p class="error" id="error" style="display:none"></p>
    <div class="fallback">
      <img class="install-icon" src="app-icon.png" alt="紙マップでどこ？ アイコン" width="56" height="56">
      <p>
        紙マップでどこ？<br>
        <br>
        アプリがインストールされていない場合は<br>
        下のボタンからインストールしてください。
      </p>
      <a href="https://apps.apple.com/jp/app/kamidoko" aria-label="App Store からダウンロード">
        <img class="appstore-badge" src="appstore-badge-ja.svg" alt="App Store からダウンロード" height="48">
      </a>
    </div>
    <div class="footer">
      <a href="https://kamidoko.github.io/">アプリ紹介</a><span class="sep">·</span>
      <a href="https://kamidoko.github.io/support.html">FAQ</a><span class="sep">·</span>
      <a href="https://kamidoko.github.io/privacy.html">プライバシー</a><span class="sep">·</span>
      <a href="https://www.apple.com/legal/internet-services/itunes/dev/stdeula/">利用規約</a>
      <a class="mail" href="mailto:kamidoko@biz.nifty.jp?subject=%E7%B4%99%E3%83%9E%E3%83%83%E3%83%97%E3%81%A7%E3%81%A9%E3%81%93%EF%BC%9F%20%E3%81%8A%E5%95%8F%E3%81%84%E5%90%88%E3%82%8F%E3%81%9B">kamidoko@biz.nifty.jp</a>
    </div>
  </div>

<script>
(function() {
  // URL fragment (`#u=...&n=...`) から取り出す。fragment はサーバへ送信されない (プライバシー)。
  function parseHash() {
    var raw = location.hash.replace(/^#/, '');
    var out = {};
    raw.split('&').forEach(function(kv) {
      var i = kv.indexOf('=');
      if (i < 0) return;
      var k = decodeURIComponent(kv.slice(0, i));
      var v = decodeURIComponent(kv.slice(i + 1));
      if (k) out[k] = v;
    });
    return out;
  }

  function escapeHTML(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  var params = parseHash();
  var icloudURL = params.u;
  var mapName = params.n;

  var titleEl = document.getElementById('title');
  var subEl = document.getElementById('sub');
  var openEl = document.getElementById('open');
  var spinnerEl = document.getElementById('spinner');
  var errorEl = document.getElementById('error');

  if (!icloudURL) {
    titleEl.textContent = 'リンクが正しくありません';
    subEl.style.display = 'none';
    errorEl.textContent = '招待リンクの内容が読み取れませんでした。送信元に再送をお願いしてください。';
    errorEl.style.display = 'block';
    return;
  }

  // タイトルを差し替え。マップ名があれば「「○○」に招待されました」、なければ「紙どこに招待されました」。
  if (mapName && mapName.length > 0) {
    titleEl.innerHTML =
      '<span class="map-name">「' + escapeHTML(mapName) + '」</span><br>に招待されました';
  } else {
    titleEl.textContent = '紙どこに招待されました';
  }
  subEl.textContent = '共有マップに参加します';

  // kamidoko-app://share?u=<icloud-url> を組み立てる。custom scheme は LINE/Safari の
  // WebView を OS-level URL handler 経路へ脱出させるための鍵。
  var schemeURL = 'kamidoko-app://share?u=' + encodeURIComponent(icloudURL);

  openEl.href = schemeURL;
  openEl.style.display = 'inline-block';
  spinnerEl.style.display = 'block';

  // 一瞬タイトル/マップ名を視認させてから自動転送（タップ不要）。600ms ≒ 認知できる短さ。
  setTimeout(function() {
    location.replace(schemeURL);
  }, 600);

  // 2026-06-21: App Store fallback は最初から表示するようにしたので、ここでは
  // 「自動転送が効かなかった場合の追加アナウンス」だけスピナーに差し替える。
  setTimeout(function() {
    spinnerEl.textContent = '参加するには、上のボタンを押してください。';
  }, 2400);
})();
</script>
</body>
</html>
